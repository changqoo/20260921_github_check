name: Synthetic integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check runtime
        run: |
          python3 --version
          git --version
      - name: Test synthetic histories
        run: python3 -m unittest discover -v
